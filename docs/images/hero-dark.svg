<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="VKSpot — музыка из VK в Spotify без потерь и подмен">
  <defs>
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132229"/>
      <stop offset="55%" stop-color="#162d3b"/>
      <stop offset="100%" stop-color="#12272f"/>
    </linearGradient>
    <radialGradient id="glow-vk-dark" cx="12%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#0077ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal-dark" cx="56%" cy="88%" r="52%">
      <stop offset="0%" stop-color="#54cbb2" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#54cbb2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-spotify-dark" cx="92%" cy="76%" r="42%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card-clip-dark">
      <rect x="0" y="0" width="1200" height="310" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <rect x="0" y="0" width="1200" height="310" fill="url(#bg-dark)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#glow-vk-dark)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#glow-teal-dark)"/>
    <rect x="0" y="0" width="1200" height="310" fill="url(#glow-spotify-dark)"/>

    <!-- Subtle geometric grid -->
    <g stroke="#2a4451" stroke-width="1" opacity="0.35">
      <line x1="0" y1="78" x2="1200" y2="78"/>
      <line x1="0" y1="156" x2="1200" y2="156"/>
      <line x1="0" y1="234" x2="1200" y2="234"/>
      <line x1="240" y1="0" x2="240" y2="310"/>
      <line x1="480" y1="0" x2="480" y2="310"/>
      <line x1="720" y1="0" x2="720" y2="310"/>
      <line x1="960" y1="0" x2="960" y2="310"/>
    </g>

    <!-- VKSpot Icon -->
    <svg x="52" y="40" width="86" height="86" viewBox="0 0 512 512">
      <rect x="16" y="16" width="480" height="480" rx="100" fill="#162d3b" stroke="#335362" stroke-width="12"/>
      <svg x="36" y="36" width="280" height="280" viewBox="0 0 68 68">
        <path d="M0 32.64C0 17.253 0 9.56 4.78 4.78 9.56 0 17.253 0 32.64 0h2.72c15.387 0 23.08 0 27.86 4.78C68 9.56 68 17.253 68 32.64v2.72c0 15.387 0 23.08-4.78 27.86C58.44 68 50.747 68 35.36 68h-2.72c-15.387 0-23.08 0-27.86-4.78C0 58.44 0 50.747 0 35.36v-2.72z" fill="#07F"/>
        <path d="M36.182 48.989c-15.498 0-24.338-10.625-24.706-28.305h7.763c.255 12.976 5.978 18.473 10.511 19.606V20.684h7.31v11.191c4.477-.482 9.18-5.581 10.767-11.191h7.31c-1.218 6.913-6.318 12.013-9.945 14.11 3.627 1.7 9.435 6.148 11.645 14.195H48.79c-1.728-5.384-6.034-9.549-11.73-10.115v10.115h-.878z" fill="#fff"/>
      </svg>
      <circle cx="355" cy="364" r="121" fill="#162d3b"/>
      <svg x="240" y="254" width="232" height="222" viewBox="0 0 236.05 225.25">
        <path fill="#1ed760" d="m122.37,3.31C61.99.91,11.1,47.91,8.71,108.29c-2.4,60.38,44.61,111.26,104.98,113.66,60.38,2.4,111.26-44.6,113.66-104.98C229.74,56.59,182.74,5.7,122.37,3.31Zm46.18,160.28c-1.36,2.4-4.01,3.6-6.59,3.24-.79-.11-1.58-.37-2.32-.79-14.46-8.23-30.22-13.59-46.84-15.93-16.62-2.34-33.25-1.53-49.42,2.4-3.51.85-7.04-1.3-7.89-4.81-.85-3.51,1.3-7.04,4.81-7.89,17.78-4.32,36.06-5.21,54.32-2.64,18.26,2.57,35.58,8.46,51.49,17.51,3.13,1.79,4.23,5.77,2.45,8.91Zm14.38-28.72c-2.23,4.12-7.39,5.66-11.51,3.43-16.92-9.15-35.24-15.16-54.45-17.86-19.21-2.7-38.47-1.97-57.26,2.16-1.02.22-2.03.26-3.01.12-3.41-.48-6.33-3.02-7.11-6.59-1.01-4.58,1.89-9.11,6.47-10.12,20.77-4.57,42.06-5.38,63.28-2.4,21.21,2.98,41.46,9.62,60.16,19.74,4.13,2.23,5.66,7.38,3.43,11.51Zm15.94-32.38c-2.1,4.04-6.47,6.13-10.73,5.53-1.15-.16-2.28-.52-3.37-1.08-19.7-10.25-40.92-17.02-63.07-20.13-22.15-3.11-44.42-2.45-66.18,1.97-5.66,1.15-11.17-2.51-12.32-8.16-1.15-5.66,2.51-11.17,8.16-12.32,24.1-4.89,48.74-5.62,73.25-2.18,24.51,3.44,47.99,10.94,69.81,22.29,5.12,2.66,7.11,8.97,4.45,14.09Z"/>
      </svg>
    </svg>

    <!-- Brand & Route Tag -->
    <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
      <text x="156" y="86" font-size="44" font-weight="700" fill="#edf5f5" letter-spacing="-0.8">VKSpot</text>
      <rect x="326" y="55" width="150" height="28" rx="14" fill="#244b45" stroke="#54cbb2" stroke-opacity="0.45" stroke-width="1"/>
      <text x="401" y="73.5" text-anchor="middle" font-size="12" font-weight="700" fill="#84dec9" letter-spacing="1.1">VK → SPOTIFY</text>
      <text x="157" y="114" font-size="13.5" font-weight="600" fill="#9eb4be" letter-spacing="0.4">Локальное desktop-приложение · Open Source (MIT)</text>

      <!-- Main Value Headline -->
      <text x="52" y="168" font-size="24" font-weight="600" fill="#edf5f5">Музыка из VK в Spotify — без потерь и подмен</text>
      <text x="52" y="198" font-size="15.5" fill="#b0c2ca">Архив медиатеки, сравнение версий на слух и аккуратный перенос</text>

      <!-- Feature Pills -->
      <g>
        <rect x="52" y="232" width="184" height="34" rx="17" fill="#1c2e37" stroke="#3a505a" stroke-width="1.2"/>
        <text x="144" y="253.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d8ebea">Без лимита треков</text>

        <rect x="248" y="232" width="214" height="34" rx="17" fill="#1c2e37" stroke="#3a505a" stroke-width="1.2"/>
        <text x="355" y="253.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d8ebea">Прослушивание в окне</text>

        <rect x="474" y="232" width="214" height="34" rx="17" fill="#1c2e37" stroke="#3a505a" stroke-width="1.2"/>
        <text x="581" y="253.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#d8ebea">Windows · macOS · Linux</text>
      </g>
    </g>

    <!-- Right Preview Card: Provenance Signature -->
    <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
      <rect x="735" y="30" width="415" height="250" rx="16" fill="#1c2e37" fill-opacity="0.94" stroke="#334d59" stroke-width="1.2"/>
      <text x="757" y="56" font-size="11" font-weight="700" fill="#8fa8b2" letter-spacing="1.1">КАК ПРОХОДИТ ПРОВЕРКА</text>

      <!-- VK Original Card -->
      <rect x="755" y="70" width="375" height="74" rx="11" fill="#15252d" stroke="#2d4551" stroke-width="1"/>
      <circle cx="775" cy="91" r="5" fill="#2c8dff"/>
      <text x="787" y="95" font-size="11" font-weight="700" fill="#89b8ff" letter-spacing="0.6">ОРИГИНАЛ ИЗ VK</text>
      <text x="771" y="118" font-size="15.5" font-weight="600" fill="#edf5f5">Северный свет (Remix)</text>
      <text x="771" y="135" font-size="12" fill="#9fb5bf">Демо-группа · 3:35</text>
      <circle cx="1095" cy="107" r="17" fill="#233842" stroke="#3a505a" stroke-width="1"/>
      <polygon points="1091,100 1091,114 1102,107" fill="#d8ebea"/>

      <!-- Connector Arrow -->
      <line x1="942" y1="146" x2="942" y2="164" stroke="#54cbb2" stroke-width="1.8"/>
      <polyline points="937,159 942,165 947,159" fill="none" stroke="#54cbb2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Spotify Match Card -->
      <rect x="755" y="168" width="375" height="92" rx="11" fill="#162d2c" stroke="#3a7d71" stroke-width="1.2"/>
      <circle cx="775" cy="190" r="5" fill="#1ed760"/>
      <text x="787" y="194" font-size="11" font-weight="700" fill="#8be8af" letter-spacing="0.6">ВЕРСИЯ SPOTIFY</text>
      <rect x="960" y="177" width="154" height="24" rx="12" fill="#244b45" stroke="#54cbb2" stroke-opacity="0.45" stroke-width="1"/>
      <text x="1037" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#84dec9">✓ Совпадают данные</text>
      <text x="771" y="220" font-size="15.5" font-weight="600" fill="#edf5f5">Северный свет (Remix)</text>
      <text x="771" y="242" font-size="12" fill="#a8c7c2">Демо-группа · 3:35 · Позиция #1 сохранена</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="308" rx="19" fill="none" stroke="#2d4854" stroke-width="1.5"/>
</svg>
