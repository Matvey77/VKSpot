name: Предложить улучшение
description: Идея новой функции или улучшения интерфейса
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает
      description: Опиши сценарий использования или текущее неудобство
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое поведение
      description: Как это должно работать в интерфейсе или рабочем процессе
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительно
      description: Примеры, ограничения или ссылки на похожие сценарии
